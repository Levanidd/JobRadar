name = "jobradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Assets are matched first; anything without a file match (i.e. /api/*) hits the Worker.
[assets]
directory = "./admin/dist"

[[d1_databases]]
binding = "DB"
database_name = "job-scout"
database_id = "111a2873-66df-4e82-850f-4b812282577e"

# Manual start: admin "Прогнать" → POST /api/run. Every minute cron continues
# a cycle that waitUntil dropped mid-walk (25s without progress), and starts
# one when a slot of the master's auto-run schedule comes due (src/schedule.ts).
[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "development"

# wrangler secret put:
# ADMIN_TOKEN
# GEMINI_API_KEY
# GEMINI_MODEL           (optional, defaults to gemini-3.7-flash)
# NEBIUS_API_KEY         (optional, Nebius Token Factory; "CHANGE_ME" counts as unset)
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# ADZUNA_APP_ID          (optional)
# ADZUNA_APP_KEY         (optional)
